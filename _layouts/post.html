<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>{{page.title}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
      body {
        color: white; /* Makes all text white */
        font-family: 'Source Code Pro';
        background-image: url('{{site.url}}/assets/background.png');
        background-size: 600px 50px;
      }
      a {
        color: white; /* Ensures all links are white */
      }
    </style>
  </head>

  <body style="background-color: #1b1b1b;">

    {% include nav.html %}
    <div style="margin-top: 10px; margin-right: 10%;margin-left: 10%;background-color: #1b1b1b; padding: 50px; padding-bottom: 100px; padding-top: 10px; border-radius: 25px">
        <div>
          <h1 style="color: white;">{{page.title}}</h1>
          <p>Posted on {{ page.date | date_to_string }}</p>
          <hr style="border: none; border-top: 6px dotted #b5e754;"> 
          {{content}}
          </div>
        </div>
    </div>
  </body>
</html>
