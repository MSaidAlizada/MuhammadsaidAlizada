---
layout: default
permalink: /posts
---
{% include nav.html %}
<div style="margin-top: 10px; background-color: #1b1b1b; padding: 50px; padding-bottom: 100px; padding-top: 10px; border-radius: 25px">
    <h1>All Posts:</h2> 
    {% for post in site.posts %}
    {% if post.pinned %}
    <h2>
      <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
    </h2>
    <p> Posted on {{ post.date | date_to_string }}</p>
    {{ post.content | strip_html | truncatewords: 20 }}
    <a href="{{ post.url | prepend: site.baseurl }}" style="display: inline-block; background-color: #555; color: white; padding: 8px 12px; text-decoration: none; border-radius: 3px; font-size: 14px;">Read More</a>
    <hr style="border: none; border-top: 6px dotted #b5e754;"> 
    {% endif %}
    {% endfor %}

  </div>
