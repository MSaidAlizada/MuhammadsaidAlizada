---
layout: default
permalink: /posts
---
{% include nav.html %}
<div style="margin-top: 10px; background-color: #1b1b1b; padding: 50px; padding-bottom: 100px; padding-top: 10px; border-radius: 25px">
    <h1>All Posts:</h2> 
    {% for post in site.posts %}
    <h2>
      <a href="{{ post.url | prepend: site.url }}">{{ post.title }}</a>
    </h2>
    <p> Posted on {{ post.date | date_to_string }}</p>
    {{ post.content | strip_html | truncatewords: 20 }}
    <button style="padding: 8px 8px; border: none; border-radius: 10px; background-color: #555; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease;" 
      onmouseover="this.style.backgroundColor='darkgrey'; this.style.transform='scale(1.05)';" 
      onmouseout="this.style.backgroundColor='grey'; this.style.transform='scale(1)';" 
      onmousedown="this.style.transform='scale(0.95)';" 
      onmouseup="this.style.transform='scale(1.05)';">
      <a href="{{ post.url | prepend: site.url }}" style="text-decoration: none;">Read More</a>
    </button>
    <hr style="border: none; border-top: 6px dotted #b5e754;"> 
    {% endfor %}

  </div>
