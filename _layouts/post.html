---
layout: default
---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      :root {
        --text-color: #333;
        --accent-color: #2962FF;
        --background-color: #fff;
        --card-color: #f8f9fa;
        --border-color: #e0e0e0;
        --meta-color: #666;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: var(--text-color);
        background-color: var(--background-color);
        margin: 0;
        padding: 0;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        margin-bottom: 2.5em;
      }

      h1 {
        font-size: 2.2em;
        margin-bottom: 0.3em;
        font-weight: 600;
      }

      .contact-info {
        margin: 0.8em 0;
        color: var(--meta-color);
      }

      .contact-info a {
        color: var(--accent-color);
        text-decoration: none;
      }

      .contact-info a:hover {
        text-decoration: underline;
      }

      .contact-info span {
        margin: 0 8px;
        color: var(--border-color);
      }

      nav {
        margin: 1.8em 0;
      }

      nav a {
        margin-right: 20px;
        text-decoration: none;
        color: var(--text-color);
        font-weight: 500;
        position: relative;
      }

      nav a:hover {
        color: var(--accent-color);
      }

      nav a:after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -4px;
        left: 0;
        background-color: var(--accent-color);
        transition: width 0.3s ease;
      }

      nav a:hover:after {
        width: 100%;
      }

      .header-divider {
        border: 0;
        height: 1px;
        background: var(--border-color);
        margin: 1.5em 0;
      }

      .post-container {
        background: var(--card-color);
        border-radius: 8px;
        padding: 2.5em;
        margin-bottom: 3em;
        border: 1px solid var(--border-color);
      }

      .post-title {
        margin-top: 0;
        font-size: 1.8em;
      }

      .post-meta {
        color: var(--meta-color);
        font-size: 0.9em;
        margin-bottom: 1.5em;
      }

      .post-divider {
        border: none;
        height: 1px;
        background: var(--border-color);
        margin: 2em 0;
      }

      .post-content {
        line-height: 1.7;
      }

      .post-content a {
        color: var(--accent-color);
        text-decoration: none;
      }

      .post-content a:hover {
        text-decoration: underline;
      }

      .post-content code {
        font-family: 'Fira Code', monospace;
        background: rgba(0,0,0,0.05);
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-size: 0.9em;
        border: 1px solid rgba(0,0,0,0.1);
      }

      .post-content pre {
        background: rgba(0,0,0,0.05);
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
        border: 1px solid rgba(0,0,0,0.1);
      }

      .post-content pre code {
        background: none;
        padding: 0;
        border: none;
      }

      .back-link {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 500;
        display: inline-block;
        margin-top: 1em;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        .container {
          padding: 30px 15px;
        }
        
        .post-container {
          padding: 1.5em;
        }
        
        nav a {
          margin-right: 15px;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    {% include nav.html %}

    <div class="post-container">
      <article class="post">
        <h1 class="post-title">{{ page.title }}</h1>
        <p class="post-meta">Posted on {{ page.date | date: "%B %-d, %Y" }}</p>
        
        <div class="post-content">
          {{ content }}
        </div>
        
        <hr class="post-divider">
        
        <a href="{{ site.url }}/posts" class="back-link">← All Posts</a>
      </article>
    </div>
  </div>
</body>
</html>
